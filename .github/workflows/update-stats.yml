
name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create output directory
        run: mkdir -p profile

      - name: Generate statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Ddoggen6&show_icons=true&hide_border=true&bg_color=0D1117&title_color=F04452&icon_color=C62838&text_color=C9D1D9&ring_color=E63946
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg

          git commit -m "chore: update GitHub statistics" || exit 0

          git push
